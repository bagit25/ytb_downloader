<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }} — vidéo et audio depuis un lien</title>
  <meta name="description" content="Collez un lien de vidéo, choisissez MP3, MP4 ou Short 9:16, et récupérez le fichier.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <link rel="icon" href="{{ url_for('static', path='favicon.svg') }}" type="image/svg+xml">
</head>
<body>
  <main class="shell">
    <header class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3v16m-7-7 7 7 7-7" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 22v5h24v-5" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>{{ app_name }}</span>
    </header>

    <form id="form" class="tool" novalidate>
      <h1><label for="url">Collez un lien, récupérez le fichier.</label></h1>

      <div class="field">
        <input id="url" name="url" type="url" inputmode="url" autocomplete="off" spellcheck="false"
               placeholder="https://youtu.be/…" required aria-describedby="status">
        <button type="button" id="paste" class="ghost">Coller</button>
      </div>

      <section id="preview" class="preview" hidden aria-live="polite">
        <img id="thumb" alt="" width="160" height="90">
        <div>
          <p id="title" class="p-title"></p>
          <p id="meta" class="p-meta"></p>
        </div>
      </section>

      <fieldset class="formats">
        <legend>Format</legend>
        <label class="fmt">
          <input type="radio" name="format" value="mp3">
          <span class="glyph g-audio" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
          <span class="fmt-name">MP3</span>
          <span class="fmt-desc">Audio seul, 192 kb/s</span>
        </label>
        <label class="fmt">
          <input type="radio" name="format" value="mp4" checked>
          <span class="glyph g-wide" aria-hidden="true"></span>
          <span class="fmt-name">MP4</span>
          <span class="fmt-desc">Vidéo 16:9 avec le son</span>
        </label>
        <label class="fmt">
          <input type="radio" name="format" value="short">
          <span class="glyph g-tall" aria-hidden="true"></span>
          <span class="fmt-name">Short</span>
          <span class="fmt-desc">9:16, {{ short_seconds }} premières secondes</span>
        </label>
      </fieldset>

      <div id="quality-row" class="quality">
        <label for="quality">Qualité vidéo</label>
        <select id="quality" name="quality">
          <option value="360">360p</option>
          <option value="480">480p</option>
          <option value="720" selected>720p</option>
          <option value="1080">1080p</option>
        </select>
      </div>

      <button id="go" class="primary" type="submit">Télécharger en MP4</button>

      <div class="progress" id="progress" hidden>
        <div class="bar"><span id="bar-fill"></span></div>
      </div>
      <p id="status" class="status" role="status"></p>
    </form>

    <footer class="foot">
      <p>Vidéos jusqu'à {{ max_minutes }} min. Les fichiers sont effacés du serveur après 15 minutes.
         Téléchargez uniquement des contenus dont vous avez les droits.</p>
    </footer>
  </main>
  <script src="{{ url_for('static', path='app.js') }}" defer></script>
</body>
</html>
